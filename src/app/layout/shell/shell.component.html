<div class="shell-topbar">
  <a class="shell-brand" routerLink="/home">
    <img [src]="logoPath" alt="Logo" class="shell-logo" />
  </a>

  <mat-toolbar class="shell-toolbar">
    <button mat-icon-button matTooltip="Mostrar/ocultar menú" (click)="toggleSidenav()">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="shell-spacer"></span>

    @if (currentUser(); as user) {
      <button mat-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        {{ user.name }}
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-roles-hint">Rol: {{ user.roles.join(', ') }}</div>
        <button mat-menu-item (click)="openChangePassword()">
          <mat-icon>lock_reset</mat-icon>
          <span>Cambiar mi contraseña</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    }
  </mat-toolbar>
</div>

<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" [opened]="sidenavOpened()" class="shell-sidenav">
    <mat-nav-list>
      @for (group of visibleNavGroups(); track group.label) {
        <div class="nav-group-label">{{ group.label }}</div>
        @for (link of group.links; track link.path) {
          <a mat-list-item [routerLink]="link.path" routerLinkActive="active-link">
            <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
            <span matListItemTitle>{{ link.label }}</span>
          </a>
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
