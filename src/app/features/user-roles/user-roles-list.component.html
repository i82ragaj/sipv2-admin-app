<div class="page">
  <div class="page-header">
    <h1>Roles de usuario</h1>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nueva asignación
    </button>
  </div>

  <mat-card class="table-card">
    @if (loading()) {
      <div class="spinner-container">
        <mat-spinner diameter="40" />
      </div>
    } @else if (userRoles().length === 0) {
      <div class="empty-state">No hay asignaciones de rol registradas.</div>
    } @else {
      <table mat-table [dataSource]="userRoles()" class="full-width-table">
        <ng-container matColumnDef="userLogin">
          <th mat-header-cell *matHeaderCellDef>Usuario</th>
          <td mat-cell *matCellDef="let userRol">{{ userRol.userLogin || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="rolName">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let userRol">{{ userRol.rolName || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let userRol">
            <mat-chip-set>
              <mat-chip class="status-chip" [class.active]="userRol.active" [class.inactive]="!userRol.active">
                {{ userRol.active ? 'Activo' : 'Inactivo' }}
              </mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-col">Acciones</th>
          <td mat-cell *matCellDef="let userRol" class="actions-col">
            <button mat-icon-button matTooltip="Editar" (click)="openEdit(userRol)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Eliminar" (click)="delete(userRol)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    }
  </mat-card>
</div>
