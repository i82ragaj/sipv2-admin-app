<div class="page">
  <div class="page-header">
    <h1>Roles</h1>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nuevo rol
    </button>
  </div>

  <mat-card class="table-card">
    @if (loading()) {
      <div class="spinner-container">
        <mat-spinner diameter="40" />
      </div>
    } @else if (roles().length === 0) {
      <div class="empty-state">No hay roles registrados.</div>
    } @else {
      <table mat-table [dataSource]="roles()" class="full-width-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let rol">{{ rol.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let rol">{{ rol.description || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let rol">
            <mat-chip-set>
              <mat-chip class="status-chip" [class.active]="rol.active" [class.inactive]="!rol.active">
                {{ rol.active ? 'Activo' : 'Inactivo' }}
              </mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-col">Acciones</th>
          <td mat-cell *matCellDef="let rol" class="actions-col">
            <button mat-icon-button matTooltip="Editar" (click)="openEdit(rol)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Eliminar" (click)="delete(rol)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    }
  </mat-card>
</div>
