  <!-- subtle thin lines echoing Spain colors, now above the title -->
  <rect x="10" y="16" width="20" height="2.4" fill="#E63946" opacity="0.85"/>
  <rect x="32" y="16" width="20" height="2.4" fill="#F1C40F" opacity="0.85"/>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif">
